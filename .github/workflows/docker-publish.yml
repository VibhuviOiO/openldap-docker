name: Publish OpenLDAP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  version:
    name: Read OpenLDAP Version
    runs-on: ubuntu-latest
    outputs:
      openldap-version: ${{ steps.version.outputs.openldap-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "openldap-version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "OpenLDAP version: ${VERSION}"

      # The tag and the VERSION file both become image tags, so a mismatch
      # publishes the same build under two different OpenLDAP versions and
      # silently repoints the one the chart pins.
      - name: Tag must match VERSION
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION | tr -d '[:space:]')
          case "$tag" in
            "$version"|"$version"-[0-9]*) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1 ;;
          esac
          echo "tag ${GITHUB_REF_NAME} matches VERSION ${version}"

  publish:
    name: Build & Push
    needs: version
    uses: VibhuviOiO/github-engineering/.github/workflows/container-publish.yml@main
    with:
      image-name: openldap
      platforms: linux/amd64,linux/arm64
      ghcr-enabled: true
      dockerhub-enabled: true
      build-args: |
        OPENLDAP_VERSION=${{ needs.version.outputs.openldap-version }}
      tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.version.outputs.openldap-version }}
        type=semver,pattern={{version}}
        type=sha,prefix=
    secrets: inherit
