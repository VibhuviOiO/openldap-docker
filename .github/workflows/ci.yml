name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Docker image
        run: docker build --no-cache -t openldap:test .

      - name: Start container
        run: |
          docker run -d --name ldap-test \
            -e LDAP_DOMAIN=test.local \
            -e LDAP_ADMIN_PASSWORD=testpass \
            -p 389:389 \
            openldap:test

      - name: Wait for LDAP to be ready
        run: |
          for i in $(seq 1 60); do
            # Check if base domain exists (initialization complete)
            if docker exec ldap-test ldapsearch -x -H ldap://localhost \
                -D "cn=Manager,dc=test,dc=local" -w testpass \
                -b "dc=test,dc=local" -s base "(objectClass=*)" dn 2>/dev/null | grep -q "dn:"; then
              echo "LDAP is ready"
              exit 0
            fi
            echo "Waiting for LDAP initialization... ($i/60)"
            sleep 3
          done
          echo "LDAP failed to start"
          docker logs ldap-test
          exit 1

      - name: Test LDAP bind
        run: |
          docker exec ldap-test ldapsearch -x -H ldap://localhost \
            -D "cn=Manager,dc=test,dc=local" -w testpass \
            -b "dc=test,dc=local" -s base "(objectClass=*)" dn


      - name: Verify VERSION matches the installed OpenLDAP
        run: |
          DECLARED=$(tr -d '[:space:]' < VERSION)
          INSTALLED=$(docker run --rm --entrypoint cat openldap:test /usr/local/share/openldap-version | tr -d '[:space:]')
          echo "VERSION file:     $DECLARED"
          echo "installed in image: $INSTALLED"
          if [ "$DECLARED" != "$INSTALLED" ]; then
            echo "::error::VERSION ($DECLARED) does not match the OpenLDAP version installed in the image ($INSTALLED)."
            echo "The published image tag is derived from VERSION, so the tag would lie about what is inside."
            exit 1
          fi
          echo "OK: image tag matches the installed OpenLDAP version"

      - name: Test health check
        run: |
          docker exec ldap-test /usr/local/bin/scripts/healthcheck.sh

      - name: Test slapd runs as non-root
        run: |
          # PID 1 is startup.sh, which runs as root on purpose: it fixes volume
          # ownership, then starts slapd with -u ldap -g ldap. The claim worth
          # verifying is that *slapd* runs as the ldap user.
          #
          # This MUST run inside the container. A previous version of this step
          # scanned /proc on the runner (no docker exec), where no slapd process
          # exists, so it failed with "no slapd process found".
          #
          # /proc/<pid>/comm is the executable name, so it cannot accidentally
          # match the shell running this check.
          docker exec ldap-test sh -c '
            slapd_user=""
            for proc in /proc/[0-9]*; do
              [ -r "$proc/comm" ] || continue
              if [ "$(cat "$proc/comm" 2>/dev/null)" = "slapd" ]; then
                slapd_user=$(stat -c "%U" "$proc" 2>/dev/null || true)
                break
              fi
            done

            echo "PID 1 (startup.sh) owner : $(stat -c "%U" /proc/1)"
            echo "slapd process owner      : ${slapd_user:-<not found>}"

            if [ -z "$slapd_user" ]; then
              echo "FAIL: no slapd process found"
              exit 1
            fi
            if [ "$slapd_user" != "ldap" ]; then
              echo "FAIL: slapd runs as ${slapd_user}, expected ldap"
              exit 1
            fi
            echo "PASS: slapd runs as the ldap user"
          '
      - name: Cleanup
        if: always()
        run: docker rm -f ldap-test 2>/dev/null || true
