name: Integration Tests

# Exercises the behaviours that are silent when they break: ACL enforcement,
# overlays, TLS, docker secrets, idempotency, fail-fast guardrails, and a real
# 3-node multi-provider cluster with convergence and catch-up after restart.
#
# The scenarios live in tests/integration/ so they can also be run locally:
#   docker build -t openldap:local .
#   tests/integration/single-node.sh openldap:local
#   tests/integration/replication.sh openldap:local

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both linters run from pinned images rather than whatever the runner
      # ships. ubuntu-latest's shellcheck predates SC2329 and errors on the
      # "# shellcheck disable=SC2329" directives in the test scripts, which
      # failed this job in ~5s without ever reading the code.
      - name: hadolint (Dockerfile)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint:2.12.0 hadolint Dockerfile

      - name: shellcheck (all shell sources)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            startup.sh scripts/*.sh tests/integration/*.sh

  # One job, one image build. Splitting these into separate jobs built the same
  # `--no-cache` image twice per run, and each run happens twice per merge
  # (pull_request and push to main), so a merge cost four full builds.
  integration:
    name: Integration scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --no-cache -t openldap:ci .

      - name: Run single-node integration scenarios
        run: bash tests/integration/single-node.sh openldap:ci

      # always(): a single-node failure must not hide whether replication also
      # broke. The job still fails on the earlier step's result.
      - name: Run 3-node replication integration test
        if: always()
        run: bash tests/integration/replication.sh openldap:ci

      - name: Dump container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter "name=ldapci" --format '{{.Names}}'); do
            echo "===== $c ====="
            docker logs "$c" 2>&1 | tail -40 || true
          done
